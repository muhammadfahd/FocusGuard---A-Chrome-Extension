<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusGuard</title>
    <link rel="stylesheet" href="popup.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <div class="header">
        <h2>🎯 FocusGuard</h2>
    </div>

    <!-- Focus Mode Toggle -->
    <div class="focus-mode-section">
        <div class="focus-mode-info">
            <div class="focus-mode-icon">🔥</div>
            <div>
                <div class="focus-mode-title">Focus Mode</div>
                <div class="focus-mode-desc" id="focusModeDesc">Block all distractions</div>
            </div>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="focusModeToggle">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div class="tabs">
        <button class="tabBtn active" id="statsBtn">📊 Stats</button>
        <button class="tabBtn" id="timerBtn">⏱️ Timer</button>
        <button class="tabBtn" id="optionsBtn">⚙️ Limits</button>
    </div>

    <div id="statsTab" class="tabContent">
        <!-- Category Filter -->
        <div class="category-filter">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="social">📱 Social</button>
            <button class="filter-btn" data-category="entertainment">📺 Fun</button>
            <button class="filter-btn" data-category="educational">📚 Study</button>
        </div>
        
        <div id="stats"></div>
        <canvas id="usageChart"></canvas>
    </div>

    <div id="timerTab" class="tabContent" style="display:none">
        <h3>Focus Timer</h3>

        <select id="mode">
            <option value="pomodoro">🍅 Pomodoro (25 min)</option>
            <option value="short">☕ Short Break (5 min)</option>
            <option value="long">🌴 Long Break (15 min)</option>
            <option value="stopwatch">⏱️ Stopwatch</option>
        </select>

        <div id="timerDisplay">00:00</div>

        <div class="timer-controls">
            <button id="startTimer" class="timer-btn">▶️ Start</button>
            <button id="pauseTimer" class="timer-btn secondary">⏸️ Pause</button>
            <button id="resetTimer" class="timer-btn secondary">🔄 Reset</button>
        </div>
    </div>

    <div id="optionsTab" class="tabContent" style="display:none">
        <h3>Set Time Limits</h3>
        <p class="help-text">Control your browsing time for specific websites</p>
        
        <input id="site" type="text" placeholder="e.g., youtube.com">
        <input id="limit" type="number" placeholder="Limit in minutes" min="1">
        <button id="setLimit">Set Limit</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
